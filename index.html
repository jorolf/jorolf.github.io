<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--<meta http-equiv="refresh" content="0; url=https://www.youtube.com/watch?v=dQw4w9WgXcQ?autoplay=1&mute=1" />-->
  <style type="text/css">
      html {
          overflow: auto;
      }

      html,
      body,
      iframe {
          margin: 0px;
          padding: 0px;
          height: 100%;
          border: none;
      }

      iframe {
          display: block;
          width: 100%;
          border: none;
          overflow-y: auto;
          overflow-x: hidden;
      }

      .wrapper {
          text-align: center;
      }

      .button {
          position: absolute;
          top: 50%;
      }
  </style>

  <script>
    function play() {
      let player = document.getElementById("player")
      player.src = "https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&controls=0&disablekb=1&rel=0"
      player.style.display = "unset"

      document.getElementById("overlay").style.display = "none"
    }

  </script>
</head>
<body style="margin: 0">
  <div class="wrapper" id="overlay">
    <button class="button" onclick="play()">Enter site</button>
  </div>

  <iframe style="display: none;"
            frameborder="0"
            marginheight="0"
            marginwidth="0"
            width="100%"
            height="100%"
            scrolling="auto"
            id="player"
            referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</body>
</html>
